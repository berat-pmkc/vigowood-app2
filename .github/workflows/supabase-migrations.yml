name: Supabase Migrations

# supabase/migrations/ altında değişiklik main'e girdiğinde bekleyen
# migration'ları canlı veritabanına uygular.
#
# GEREKLİ SECRETS (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - Project Settings > Database > Database password
#   SUPABASE_PROJECT_ID    - proje ref (mdxaktebpuhlwacqcven)
#
# Elle çalıştırmak için: Actions sekmesi > Supabase Migrations > Run workflow

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

# Aynı anda birden fazla migration job'u çalışmasın — yarış durumu
# veritabanı geçmişini bozabilir. Sıraya alır, iptal ETMEZ.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Bekleyen migration'ları uygula
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Secrets kontrolü
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v secret'ı tanımlı değil"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Projeye bağlan
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migration durumu (local vs remote)
        run: supabase migration list --linked

      - name: Uygulanacaklar (dry-run)
        run: supabase db push --linked --dry-run

      - name: Migration'ları uygula
        run: supabase db push --linked --yes

      - name: Sonuç
        run: |
          echo "--- Uygulama sonrası durum ---"
          supabase migration list --linked
